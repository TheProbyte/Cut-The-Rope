name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"
  GODOT_RELEASE: "4.3-stable"
  APK_NAME: "drip-debug.apk"

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate JSON level definitions
        run: python3 tools/validate_levels.py

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Godot 4.3 binary and Android export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/.local/bin/godot4
            /home/runner/.local/share/godot/export_templates/4.3.stable
          key: godot-${{ env.GODOT_RELEASE }}-linux-templates

      - name: Install Godot 4.3 headless and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p /home/runner/.local/bin
          mkdir -p /home/runner/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable

          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_RELEASE }}/Godot_v${{ env.GODOT_RELEASE }}_linux.x86_64.zip"
          unzip -o -q /tmp/godot.zip -d /tmp/godot_bin
          mv /tmp/godot_bin/Godot_v${{ env.GODOT_RELEASE }}_linux.x86_64 /home/runner/.local/bin/godot4
          chmod +x /home/runner/.local/bin/godot4
          rm -rf /tmp/godot.zip /tmp/godot_bin

          curl -sSL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_RELEASE }}/Godot_v${{ env.GODOT_RELEASE }}_export_templates.tpz"
          unzip -o -q /tmp/templates.tpz -d /tmp/templates_out
          mv /tmp/templates_out/templates/* /home/runner/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable/
          rm -rf /tmp/templates.tpz /tmp/templates_out

      - name: Configure Android SDK and persistent debug keystore for Godot
        run: |
          mkdir -p /home/runner/.config/godot
          mkdir -p build

          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at: $SDK_PATH"

          # Use persistent debug keystore so every future build updates in-place cleanly on Android
          KEYSTORE_PATH="${GITHUB_WORKSPACE}/tools/drip-debug.keystore"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            keytool -genkeypair \
              -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=DRIP Debug,O=TheProbyte,C=US"
          fi

          # Monotonically increment Android versionCode per workflow run
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" export_presets.cfg

          cat > /home/runner/.config/godot/editor_settings-4.3.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${SDK_PATH}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${KEYSTORE_PATH}"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import resources and export Android debug APK
        run: |
          export PATH="/home/runner/.local/bin:$PATH"
          godot4 --version
          godot4 --headless --import --quit
          godot4 --headless --export-debug "Android" "build/${APK_NAME}"
          ls -lh "build/${APK_NAME}"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: drip-debug-apk
          path: build/${{ env.APK_NAME }}

      - name: Publish GitHub Release with debug APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="build-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          TITLE="DRIP Debug APK (Build #${GITHUB_RUN_NUMBER})"
          NOTES="Automated Android debug build from commit \`${SHORT_SHA}\`. Download \`${APK_NAME}\` below and install it on your Android device (enable *Install unknown apps* if prompted)."

          gh release create "$TAG" "build/${APK_NAME}" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --latest
